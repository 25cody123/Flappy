<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Happy Birds</title>
  <meta name="theme-color" content="#4ec5ff" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      background: linear-gradient(#79d8ff, #dff7ff);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: white;
    }
    #wrap {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #8ce2ff 0%, #3db7f4 50%, #158ad5 100%);
    }
    canvas {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    #hudControls {
      position: fixed;
      top: calc(12px + var(--safe-top));
      right: calc(12px + var(--safe-right));
      display: flex;
      gap: 10px;
      z-index: 10;
    }
    .hud-btn {
      width: 48px;
      height: 48px;
      border: 2px solid rgba(255,255,255,.65);
      border-radius: 16px;
      background: rgba(0,0,0,.22);
      color: white;
      font-size: 23px;
      font-weight: 800;
      box-shadow: 0 8px 18px rgba(0,0,0,.18);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .hud-btn:active { transform: scale(.94); }
    #startCard {
      position: fixed;
      left: max(18px, var(--safe-left));
      right: max(18px, var(--safe-right));
      bottom: calc(34px + var(--safe-bottom));
      z-index: 9;
      padding: 18px 16px;
      border-radius: 22px;
      background: rgba(0,0,0,.28);
      border: 1px solid rgba(255,255,255,.35);
      text-align: center;
      box-shadow: 0 12px 30px rgba(0,0,0,.18);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      user-select: none;
    }
    #startCard h1 { margin: 0 0 6px; font-size: 30px; }
    #startCard p { margin: 4px 0; opacity: .95; font-size: 16px; }
    .hidden { display: none; }
    .sr-only {
      position:absolute; width:1px; height:1px; padding:0; margin:-1px;
      overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="game"></canvas>
  </div>

  <div id="hudControls" role="group" aria-label="Game controls">
    <button id="pauseBtn" class="hud-btn" type="button" aria-label="Pause game" aria-pressed="false" title="Pause">⏸</button>
    <button id="muteBtn" class="hud-btn" type="button" aria-label="Mute audio" aria-pressed="false" title="Mute">🔊</button>
  </div>

  <div id="startCard">
    <h1>Happy Birds</h1>
    <p>Tap to flap. Dodge the pipes.</p>
    <p>Tap after a crash to restart.</p>
  </div>

  <div id="statusMessage" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <audio id="bgm" preload="auto" loop playsinline webkit-playsinline="true">
    <source src="./audio/background.wav" type="audio/wav" />
  </audio>

  <script src="./game.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
